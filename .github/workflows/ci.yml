# YOLO 检测部署 | .github/workflows/ci.yml
# 提交代码后，GitHub 的 Linux runner 编译运行队列与 Benchmark 的小测试，
# 再执行 AP 和 Profile 的 Python 测试。这组快速检查只需要合成数据。


name: Portable core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standard-library-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Queue and bounded statistics without model or GPU
        run: |
          mkdir -p results
          g++ -std=c++17 -pthread -Iinclude tests/test_thread_safe_queue.cpp -o results/queue_test
          ./results/queue_test
          g++ -std=c++17 -Iinclude tests/test_benchmark.cpp src/benchmark.cpp -o results/benchmark_test
          ./results/benchmark_test
      - name: Detection AP and profile aggregation checks without datasets
        run: |
          python3 tests/test_evaluation.py
          python3 tests/test_profile.py
