name: Portable core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standard-library-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Queue and bounded statistics without model or GPU
        run: |
          mkdir -p results
          g++ -std=c++17 -pthread -Iinclude tests/test_thread_safe_queue.cpp -o results/queue_test
          ./results/queue_test
          g++ -std=c++17 -Iinclude tests/test_benchmark.cpp src/benchmark.cpp -o results/benchmark_test
          ./results/benchmark_test
